<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Night Garden</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Dancing+Script:wght@600&display=swap');

  :root {
    --dark: #050a12;
    --leaf-dark: #0d2a1f;
    --leaf-mid: #1a4a2e;
    --leaf-light: #256b3a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    perspective: 1000px;
    font-family: 'Cormorant Garamond', serif;
  }

  /* ─── SKY ─── */
  .sky {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, #101c3a 0%, #050a12 60%);
    z-index: 0;
  }

  /* ─── STARS ─── */
  .stars { position: fixed; inset: 0; z-index: 1; }
  .star {
    position: absolute; border-radius: 50%; background: white;
    animation: starTwinkle var(--dur) ease-in-out infinite alternate;
    animation-delay: var(--del);
    opacity: 0;
    animation-fill-mode: forwards;
  }
  @keyframes starTwinkle {
    0%   { opacity: var(--min-op); transform: scale(1); }
    100% { opacity: var(--max-op); transform: scale(1.6); }
  }

  /* ─── SCENE ─── */
  .scene {
    position: relative;
    width: min(520px, 100vw);
    height: 100vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    transform-style: preserve-3d;
    z-index: 10;
    will-change: transform;
  }
  @keyframes panorama {
    0%   { transform: rotateY(-6deg) translateX(-15px); }
    100% { transform: rotateY(6deg)  translateX(15px);  }
  }
  /* ─── GROUND ─── */
  .ground {
    position: absolute; bottom: 0; width: 100%; height: 180px;
    background: linear-gradient(to top, #04150c 0%, #0a2018 50%, transparent 100%);
  }

  /* ─── GRASS ─── */
  .grass-group { position: absolute; bottom: 0; width: 100%; }
  .blade {
    position: absolute; bottom: 0;
    width: var(--w); height: var(--h); left: var(--x);
    background: linear-gradient(to top, var(--leaf-dark) 0%, var(--leaf-mid) 60%, var(--leaf-light) 100%);
    transform-origin: bottom center;
    clip-path: polygon(40% 100%, 60% 100%, 80% 0%);
    animation: bladeSway var(--sw) ease-in-out infinite alternate;
    animation-delay: var(--sd);
    opacity: 0;
    animation-fill-mode: forwards;
  }
  @keyframes bladeSway {
    0%   { opacity: 1; transform: rotate(var(--ra)); }
    100% { opacity: 1; transform: rotate(var(--rb)); }
  }

  /* ─── STEM ─── */
  .stem {
    position: absolute;
    bottom: var(--sb); left: var(--sl);
    width: var(--sw2); height: 0;
    background: linear-gradient(to right, var(--leaf-dark), var(--leaf-mid) 40%, var(--leaf-dark));
    transform-origin: bottom center;
    border-radius: 4px 4px 2px 2px;
    z-index: var(--sz);
    transform: rotate(var(--sr));
    overflow: visible;
    opacity: 0;
    transition: height 1.2s cubic-bezier(0.22,1,0.36,1), opacity 0.3s;
    will-change: transform;
  }
  .stem.grown {
    height: var(--sh);
    opacity: 1;
    animation: stemNod var(--nd) ease-in-out infinite alternate;
    animation-delay: var(--ndel);
  }
  @keyframes stemNod {
    0%   { transform: rotate(var(--na)); }
    100% { transform: rotate(var(--nb)); }
  }

  /* ─── LEAF ─── */
  .leaf {
    position: absolute;
    width: var(--lw); height: var(--lh);
    background: linear-gradient(135deg, var(--leaf-light) 0%, var(--leaf-mid) 50%, var(--leaf-dark) 100%);
    border-radius: 0 80% 0 80%;
    top: var(--lt); left: var(--ll);
    transform: rotate(var(--lr)) scaleX(var(--lsx));
    transform-origin: 0% 100%;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
    opacity: 0;
    transition: opacity 0.6s 0.4s;
  }
  .stem.grown .leaf { opacity: 1; }

  /* ─── FLOWER HEAD (child of stem, ikut goyang bareng batang) ─── */
  .flower-head {
    position: absolute;
    top: 0;
    left: 50%;
    width: var(--fw);
    height: var(--fh);
    transform: translateX(-50%) translateY(-85%) scale(0.1);
    transform-origin: bottom center;
    filter: drop-shadow(0 0 18px var(--glow)) drop-shadow(0 0 40px var(--glow2));
    opacity: 0;
    transition: opacity 0.8s, transform 1s cubic-bezier(0.34,1.56,0.64,1);
    will-change: transform, opacity;
  }
  .stem.grown .flower-head {
    opacity: 1;
    transform: translateX(-50%) translateY(-85%) scale(1);
  }
  .flower-head svg { width: 100%; height: 100%; overflow: visible; }

  /* ─── CORE GLOW ─── */
  .core-glow { animation: coreGlow 2s ease-in-out infinite alternate; }
  @keyframes coreGlow {
    0%   { opacity: 0.7; }
    100% { opacity: 1.0; }
  }

  /* ─── SPARKS ─── */
  .spark {
    position: absolute; border-radius: 50%;
    width: var(--ss); height: var(--ss);
    left: var(--sx2); bottom: var(--sy);
    background: var(--sc);
    box-shadow: 0 0 6px 2px var(--sc);
    animation: sparkRise var(--sd2) ease-out infinite;
    animation-delay: var(--sdel);
    opacity: 0;
  }
  @keyframes sparkRise {
    0%   { opacity: 0; transform: translate(0,0) scale(1); }
    20%  { opacity: 1; }
    80%  { opacity: 0.6; }
    100% { opacity: 0; transform: translate(var(--sxd),-220px) scale(0.2); }
  }

  /* ─── ORBS ─── */
  .orb {
    position: absolute; border-radius: 50%;
    background: var(--oc); box-shadow: 0 0 20px 8px var(--oc);
    width: var(--os); height: var(--os);
    left: var(--ox); top: var(--oy);
    animation: orbDrift var(--od) ease-in-out infinite alternate;
    animation-delay: var(--odel);
    opacity: 0.4;
  }
  @keyframes orbDrift {
    0%   { transform: translate(0,0) scale(1); opacity: 0.3; }
    100% { transform: translate(var(--odx),var(--ody)) scale(1.3); opacity: 0.6; }
  }

  /* ─── MESSAGE ─── */
  .message-wrap {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    pointer-events: none;
  }
  .message {
    text-align: center;
    opacity: 0;
    transform: translateY(30px) scale(0.9);
    transition: opacity 1.6s ease, transform 1.6s cubic-bezier(0.22,1,0.36,1);
  }
  .message.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .message-line1 {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(2rem, 8vw, 3.4rem);
    color: #ffcce8;
    text-shadow:
      0 0 20px rgba(255,100,180,0.9),
      0 0 50px rgba(255,80,160,0.5),
      0 0 90px rgba(200,60,140,0.3);
    line-height: 1.2;
    display: block;
    animation: textFloat 4s ease-in-out infinite alternate;
    animation-play-state: paused;
  }
  .message.visible .message-line1 {
    animation-play-state: running;
  }
  .message-line2 {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(1.4rem, 5.5vw, 2.2rem);
    color: #e8b0ff;
    text-shadow:
      0 0 16px rgba(200,120,255,0.9),
      0 0 40px rgba(160,80,220,0.5);
    display: block;
    margin-top: 0.3em;
    animation: textFloat2 4.5s ease-in-out infinite alternate;
    animation-play-state: paused;
    animation-delay: 0.5s;
  }
  .message.visible .message-line2 {
    animation-play-state: running;
  }
  @keyframes textFloat {
    0%   { transform: translateY(0px); text-shadow: 0 0 20px rgba(255,100,180,0.9), 0 0 50px rgba(255,80,160,0.5); }
    100% { transform: translateY(-8px); text-shadow: 0 0 30px rgba(255,130,200,1), 0 0 70px rgba(255,100,180,0.7), 0 0 120px rgba(200,60,140,0.4); }
  }
  @keyframes textFloat2 {
    0%   { transform: translateY(0px); }
    100% { transform: translateY(-6px); }
  }

  /* heart scatter after message */
  .heart-particle {
    position: fixed;
    font-size: var(--hs);
    top: var(--ht);
    left: var(--hx);
    opacity: 0;
    z-index: 99;
    animation: heartFly var(--hd) ease-out forwards;
    animation-delay: var(--hdel);
    pointer-events: none;
  }
  @keyframes heartFly {
    0%   { opacity: 0; transform: translate(0,0) scale(0.5) rotate(0deg); }
    20%  { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--hxd), var(--hyd)) scale(1.2) rotate(var(--hrot)); }
  }

  /* ─── HEART CANVAS ─── */
  #heartCanvas { position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99; }

  /* ─── MUSIC ─── */
  .music-btn {
    position:fixed;bottom:1.6rem;right:1.4rem;z-index:200;
    width:48px;height:48px;border-radius:50%;
    border:1.5px solid rgba(255,180,220,0.4);
    background:rgba(10,4,20,0.7);backdrop-filter:blur(8px);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    font-size:1.3rem;color:#ffcce8;
    box-shadow:0 0 18px rgba(255,100,180,0.3);
    transition:box-shadow .3s,transform .2s;user-select:none;
  }
  .music-btn:hover{box-shadow:0 0 28px rgba(255,100,180,0.6);transform:scale(1.08);}
  .music-btn.playing{animation:musicPulse 1.8s ease-in-out infinite;}
  @keyframes musicPulse{
    0%,100%{box-shadow:0 0 18px rgba(255,100,180,0.3);}
    50%{box-shadow:0 0 36px rgba(255,100,180,0.7),0 0 60px rgba(200,80,220,0.3);}
  }
  .music-label {
    position:fixed;bottom:1.55rem;right:4.4rem;z-index:200;
    font-family:'Dancing Script',cursive;font-size:.85rem;
    color:rgba(255,200,230,0.7);pointer-events:none;
    opacity:0;transition:opacity .4s;white-space:nowrap;
  }
  .music-label.show{opacity:1;}
  .music-upload {
    position:fixed;bottom:4.2rem;right:1.4rem;z-index:200;
    display:flex;flex-direction:column;align-items:flex-end;gap:.5rem;
    opacity:0;pointer-events:none;transform:translateY(8px);
    transition:opacity .3s,transform .3s;
  }
  .music-upload.open{opacity:1;pointer-events:all;transform:translateY(0);}
  .music-upload label {
    background:rgba(10,4,20,0.85);border:1.5px solid rgba(255,180,220,0.35);
    backdrop-filter:blur(8px);color:#ffcce8;
    font-family:'Dancing Script',cursive;font-size:.9rem;
    padding:.45rem 1rem;border-radius:20px;cursor:pointer;white-space:nowrap;
  }
  .music-upload label:hover{background:rgba(255,100,180,0.2);}
  .music-upload input{display:none;}


  /* ─── SPLASH ─── */
  #splash {
    position: fixed;
    inset: 0;
    z-index: 999;
    background: #050a12;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 1.2s ease;
  }
  #splash.fade-out {
    opacity: 0;
    pointer-events: none;
  }
  .splash-title {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(2.2rem, 9vw, 3.8rem);
    color: #ffcce8;
    text-shadow: 0 0 30px rgba(255,100,180,0.8), 0 0 70px rgba(200,60,140,0.4);
    animation: splashPulse 2.5s ease-in-out infinite alternate;
    margin-bottom: 1rem;
  }
  .splash-hint {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(0.9rem, 3.5vw, 1.2rem);
    color: rgba(200,160,220,0.6);
    letter-spacing: 0.15em;
    animation: splashPulse 2.5s ease-in-out infinite alternate;
    animation-delay: 0.4s;
  }
  .splash-heart {
    font-size: 2.5rem;
    margin-bottom: 1.2rem;
    animation: splashBeat 1.2s ease-in-out infinite;
  }
  @keyframes splashPulse {
    0%   { opacity: 0.5; }
    100% { opacity: 1; }
  }
  @keyframes splashBeat {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.18); }
  }

</style>
</head>

</div>

<!-- HEART CANVAS -->
<canvas id="heartCanvas"></canvas>

<!-- MUSIC -->
<div class="music-upload" id="musicUpload">
  <label>🎵 Pilih lagu (MP3)<input type="file" id="musicFile" accept="audio/*"></label>
</div>
<span class="music-label" id="musicLabel">♪ no music</span>
<button class="music-btn" id="musicBtn" title="Music">🎵</button>
<audio id="bgAudio" loop src="song.mp3"></audio>

<script>
// ── STARS ──
const starsEl = document.getElementById('stars');
for (let i = 0; i < 120; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random() * 2.5 + 0.5;
  s.style.cssText = `
    width:${size}px;height:${size}px;
    left:${Math.random()*100}%;top:${Math.random()*70}%;
    --dur:${(Math.random()*3+1.5).toFixed(2)}s;
    --del:${(Math.random()*4 + 1).toFixed(2)}s;
    --min-op:${(Math.random()*0.3+0.1).toFixed(2)};
    --max-op:${(Math.random()*0.5+0.5).toFixed(2)};
  `;
  starsEl.appendChild(s);
}

// ── GRASS ──
const grassEl = document.getElementById('grass');
const bladeData = [
  {x:'5%',h:'140px',w:'12px',ra:'-8deg',rb:'-3deg',sw:'2.5s',sd:'0s'},
  {x:'10%',h:'100px',w:'9px',ra:'-5deg',rb:'2deg',sw:'3s',sd:'-1s'},
  {x:'15%',h:'160px',w:'11px',ra:'-10deg',rb:'-4deg',sw:'2.8s',sd:'-0.5s'},
  {x:'20%',h:'80px',w:'8px',ra:'3deg',rb:'8deg',sw:'3.2s',sd:'-2s'},
  {x:'25%',h:'120px',w:'10px',ra:'-4deg',rb:'2deg',sw:'2.6s',sd:'0.5s'},
  {x:'30%',h:'90px',w:'8px',ra:'2deg',rb:'7deg',sw:'3.5s',sd:'-1.5s'},
  {x:'68%',h:'130px',w:'11px',ra:'4deg',rb:'10deg',sw:'2.9s',sd:'-0.3s'},
  {x:'73%',h:'100px',w:'9px',ra:'6deg',rb:'11deg',sw:'3.1s',sd:'-1.2s'},
  {x:'78%',h:'150px',w:'12px',ra:'8deg',rb:'14deg',sw:'2.7s',sd:'0.2s'},
  {x:'83%',h:'85px',w:'8px',ra:'5deg',rb:'9deg',sw:'3.4s',sd:'-0.8s'},
  {x:'88%',h:'110px',w:'9px',ra:'10deg',rb:'15deg',sw:'3s',sd:'-2s'},
  {x:'92%',h:'70px',w:'7px',ra:'7deg',rb:'12deg',sw:'2.5s',sd:'-1s'},
  {x:'96%',h:'130px',w:'10px',ra:'9deg',rb:'14deg',sw:'2.8s',sd:'0.5s'},
];
bladeData.forEach(b => {
  const d = document.createElement('div');
  d.className = 'blade';
  d.style.cssText = `--x:${b.x};--h:${b.h};--w:${b.w};--ra:${b.ra};--rb:${b.rb};--sw:${b.sw};--sd:${b.sd};`;
  grassEl.appendChild(d);
});

// ── SPARKS ──
const sparksEl = document.getElementById('sparks');
const sparkColors = ['#ffe080','#ff70c0','#80d0ff','#ffd060','#c87de8','#ff9030'];
const sparkPositions = [
  {x:'30%'},{x:'40%'},{x:'50%'},{x:'55%'},{x:'35%'},{x:'45%'},
  {x:'52%'},{x:'28%'},{x:'48%'},{x:'60%'},{x:'33%'},{x:'57%'},
  {x:'42%'},{x:'38%'},{x:'62%'},{x:'25%'},{x:'65%'},{x:'53%'},
  {x:'47%'},{x:'43%'},{x:'37%'},{x:'68%'}
];
sparkPositions.forEach((sp, i) => {
  const el = document.createElement('div');
  el.className = 'spark';
  const size = (Math.random()*3+2).toFixed(1);
  const color = sparkColors[i % sparkColors.length];
  const dx = (Math.random()*60-30).toFixed(0) + 'px';
  el.style.cssText = `
    --ss:${size}px;--sx2:${sp.x};--sy:${Math.random()*40+5}px;
    --sc:${color};--sd2:${(Math.random()*2+1.5).toFixed(2)}s;
    --sdel:${(Math.random()*4 + 5).toFixed(2)}s;--sxd:${dx};
  `;
  sparksEl.appendChild(el);
});

// ── HEART CANVAS ──
const heartCanvas = document.getElementById('heartCanvas');
const ctx = heartCanvas.getContext('2d');
let particles = [];
const EMOJIS = ['❤️','💕','🌸','✨','💖','🌺','💗','🌷'];
function resizeCanvas(){heartCanvas.width=window.innerWidth;heartCanvas.height=window.innerHeight;}
resizeCanvas();window.addEventListener('resize',resizeCanvas);

function spawnHearts(){
  for(let i=0;i<18;i++) setTimeout(()=>{
    particles.push({
      emoji:EMOJIS[Math.floor(Math.random()*EMOJIS.length)],
      x:Math.random()*window.innerWidth,
      y:window.innerHeight*(0.15+Math.random()*0.65),
      vx:(Math.random()-.5)*1.0, vy:-(Math.random()*1.2+0.5),
      alpha:0, angle:0, rot:(Math.random()-.5)*0.03,
      size:Math.random()*14+12, scale:Math.random()*0.6+0.7,
      life:0, maxLife:Math.random()*90+90, fadeIn:20, fadeOut:35,
    });
  }, Math.random()*2000);
}

function drawParticles(){
  ctx.clearRect(0,0,heartCanvas.width,heartCanvas.height);
  particles=particles.filter(p=>p.life<p.maxLife);
  for(const p of particles){
    p.life++;p.x+=p.vx;p.y+=p.vy;p.vy*=0.997;p.angle+=p.rot;
    p.alpha = p.life<p.fadeIn ? p.life/p.fadeIn
            : p.life>p.maxLife-p.fadeOut ? (p.maxLife-p.life)/p.fadeOut : 1;
    ctx.save();
    ctx.globalAlpha=Math.max(0,Math.min(1,p.alpha));
    ctx.font=`${p.size*p.scale}px serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.translate(p.x,p.y);ctx.rotate(p.angle);
    ctx.fillText(p.emoji,0,0);
    ctx.restore();
  }
}

// ── ENTRANCE SEQUENCE ──
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

async function runEntrance() {
  await delay(400);
  document.getElementById('stem-left').classList.add('grown');
  await delay(600);
  document.getElementById('stem-right').classList.add('grown');
  await delay(500);
  document.getElementById('stem-center').classList.add('grown');
  // bunga muncul otomatis karena child dari stem (via CSS .stem.grown .flower-head)
  await delay(2200);
  document.getElementById('message').classList.add('visible');
  await delay(800);
  spawnHearts();
  setInterval(spawnHearts, 6000);
}

// ── SPLASH GATE — semua dimulai setelah tap ──
let started = false;
document.getElementById('splash').addEventListener('click', function startAll() {
  if (started) return;
  started = true;
  const splash = document.getElementById('splash');
  splash.classList.add('fade-out');
  setTimeout(() => splash.remove(), 1300);

  // start music with fade-in
  const a = document.getElementById('bgAudio');
  a.volume = 0;
  a.play().then(() => {
    let v = 0;
    const fi = setInterval(() => {
      v = Math.min(v + 0.015, 0.75);
      a.volume = v;
      if (v >= 0.75) clearInterval(fi);
    }, 80);
  }).catch(() => {});

  // start entrance animation
  runEntrance();
});

// ── rAF MAIN LOOP — batang goyang, bunga ikut otomatis ──
const scene = document.getElementById('scene');
const stems = [
  { el: document.getElementById('stem-left'),   baseRot: -6, amp: 4, speed: 0.00038, phase: 0.5 },
  { el: document.getElementById('stem-center'), baseRot:  0, amp: 3, speed: 0.00042, phase: 0 },
  { el: document.getElementById('stem-right'),  baseRot:  6, amp: 5, speed: 0.00035, phase: 2.0 },
];

function tick(ts) {
  // panorama
  const pan  = Math.sin(ts * 0.000055) * 6;
  const panX = Math.sin(ts * 0.000055) * 15;
  scene.style.transform = `rotateY(${pan}deg) translateX(${panX}px)`;

  // stem nod — bunga & daun ikut karena mereka child element
  stems.forEach(s => {
    if (!s.el.classList.contains('grown')) return;
    const r = s.baseRot + Math.sin(ts * s.speed + s.phase) * s.amp;
    s.el.style.transform = `rotate(${r}deg)`;
  });

  drawParticles(ts);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ── MUSIC ──
const audio=document.getElementById('bgAudio');
const musicBtn=document.getElementById('musicBtn');
const musicFile=document.getElementById('musicFile');
const musicUpload=document.getElementById('musicUpload');
const musicLabel=document.getElementById('musicLabel');
let musicLoaded=false,menuOpen=false;

musicBtn.addEventListener('click',()=>{
  if(!musicLoaded){
    menuOpen=!menuOpen;
    musicUpload.classList.toggle('open',menuOpen);
    musicLabel.textContent=menuOpen?'♪ pilih lagu dulu':'♪ no music';
    musicLabel.classList.add('show');
  } else {
    if(audio.paused){
      audio.play();musicBtn.classList.add('playing');musicBtn.textContent='⏸';
    } else {
      audio.pause();musicBtn.classList.remove('playing');musicBtn.textContent='🎵';
      musicLabel.textContent='♪ paused';
    }
  }
});

musicFile.addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  audio.src=URL.createObjectURL(file);audio.volume=0;
  audio.play().then(()=>{
    let v=0;const fi=setInterval(()=>{v=Math.min(v+0.02,0.75);audio.volume=v;if(v>=0.75)clearInterval(fi);},60);
  }).catch(()=>{});
  musicLoaded=true;musicUpload.classList.remove('open');menuOpen=false;
  musicBtn.textContent='⏸';musicBtn.classList.add('playing');
  musicLabel.textContent='♪ '+file.name.replace(/\.[^.]+$/,'');
  musicLabel.classList.add('show');
});


</script>
</body>
</html>
